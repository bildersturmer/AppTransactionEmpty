name: Remote Architecture Scaffolding

on:
  workflow_dispatch: # Allows you to trigger this manually from the browser button

jobs:
  create-skeleton:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the cloud runner to push files back to your repo

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Construct Solution and Projects
      run: |
        dotnet new sln --name TestTransactions
        dotnet new wpf -o RecordApp --framework net10.0
        
        dotnet sln TestTarifffs.slnx add RecordApp/RecordApp.csproj
        dotnet new mstest -o RecordApp.Tests --target-framework net10.0
        dotnet sln TestTarifffs.slnx add RecordApp.Tests/RecordApp.Tests.csproj

    - name: Commit Skeleton Back to GitHub Repo
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Automated scaffolding of TestTarifffs XML solution architecture"
        git push
